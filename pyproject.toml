[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bjlab"
dynamic = ["version"]
description = "Open blackjack simulator: action EVs and optimal actions, strategy and deviation charts, counting simulation, and bankroll math (EV/hr, variance, risk of ruin, N0, bet spreads)."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
authors = [{ name = "Jack Ringel" }]
keywords = ["blackjack", "card counting", "advantage play", "simulation", "kelly", "risk of ruin"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bjlab = "bjlab.cli:main"

[project.urls]
Homepage = "https://github.com/jackringel/bjlab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "bjlab.__version__" }

[tool.setuptools.package-data]
bjlab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
